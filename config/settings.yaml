# 应用配置
app:
  name: "AutoBrowser"
  version: "1.0.0"

# 爬取配置
crawler:
  keywords:
    - "AI"
    - "artificial intelligence"
    - "OpenAI"
    - "Claude"
    - "GPT"
    - "LLM"
  sources:
    - twitter
    - reddit
  limit: 10  # 每次爬取数量
  interval_hours: 3  # 爬取间隔

# 内容筛选配置
filter:
  min_engagement: 10  # 最小互动数
  max_age_hours: 48  # 最大内容时效（小时）

# 发布配置
publisher:
  max_daily_posts: 8  # 每日最大发布数
  min_interval_minutes: 30  # 发布间隔

# 小红书配置
xiaohongshu:
  chrome_port: 9222
  timeout: 30

# AI 配置（支持多模型切换）
ai:
  # 当前使用的 AI 提供商: kimi / deepseek
  provider: "deepseek"

  # Kimi 配置
  kimi:
    api_key: "sk-zBSh23bHsb1780TPkaYz9eK324qWerCHD294fLKcBWVqW2KX"
    api_base: "https://api.moonshot.cn/v1"
    model: "kimi-k2.5"
    temperature: 1

  # DeepSeek 配置
  deepseek:
    api_key: "sk-968a580a93dc42b191ab2b36421e333b"
    api_base: "https://api.deepseek.com"
    model: "deepseek-chat"
    temperature: 0.7

# 封面生成配置
cover:
  enabled: true
  output_dir: "assets/covers"
  default_template: "gradient"  # 封面模板风格

# 日志配置
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
